<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="skull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#18181b"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#skull)" stroke-width="2" opacity="0.5"/>
  <!-- Rat silhouette -->
  <g filter="url(#glow)">
    <!-- Body -->
    <ellipse cx="50" cy="55" rx="25" ry="18" fill="url(#skull)"/>
    <!-- Head -->
    <circle cx="30" cy="48" r="15" fill="url(#skull)"/>
    <!-- Ears -->
    <circle cx="22" cy="35" r="8" fill="url(#skull)"/>
    <circle cx="38" cy="33" r="8" fill="url(#skull)"/>
    <!-- Snout -->
    <ellipse cx="18" cy="50" rx="6" ry="4" fill="url(#skull)"/>
    <!-- Eye -->
    <circle cx="28" cy="45" r="3" fill="#18181b"/>
    <!-- Tail -->
    <path d="M75 55 Q90 45 85 70 Q80 85 70 80" fill="none" stroke="url(#skull)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
